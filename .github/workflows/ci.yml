name: validate-skillkit
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyyaml
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check editor JavaScript
        run: node --check skills/offline-svg-color-workbench/assets/editor.js
