name: import-grounded-architecture-v02
on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import-grounding.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'zmuxuny/architectural-lineart-skillkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          echo "5a3be1a14f8a6e46611697bd9cd780cbb71c7dc056d1767b809f2ef2c9930ee0  .bootstrap/factual-photo-grounding_v0.2.0.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          with tarfile.open('.bootstrap/factual-photo-grounding_v0.2.0.tar.gz','r:gz') as tf:
              entries=tf.getmembers()
              assert len(entries)==18
              assert all(e.isfile() and not e.name.startswith('/') and '..' not in e.name.split('/') for e in entries)
          PY
          tar -xzf .bootstrap/factual-photo-grounding_v0.2.0.tar.gz -C .
          rm -rf .bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full tests including evidence and approval gates
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyyaml
          python -m unittest discover -s tests -v
          python -m py_compile skills/campus-architectural-lineart/scripts/reference_pipeline.py skills/campus-architectural-lineart/scripts/compose.py skills/raster-to-layered-svg/scripts/convert.py
          node --check skills/offline-svg-color-workbench/assets/editor.js
      - name: Commit files without modifying workflow permissions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: photo-grounded image generation with evidence and human review gates'
          git push origin HEAD:main
