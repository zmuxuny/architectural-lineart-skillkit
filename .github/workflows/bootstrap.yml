name: bootstrap-skillkit
on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zmuxuny/architectural-lineart-skillkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.bin > /tmp/skillkit-source.zip
          echo '1c9c658863f68c7aa0afdb77f97a090bd6aad1b058ec75622a17b9cb3dba96a7  /tmp/skillkit-source.zip' | sha256sum -c -
          mkdir -p /tmp/skillkit-extract
          unzip -q /tmp/skillkit-source.zip -d /tmp/skillkit-extract
          test -f /tmp/skillkit-extract/architectural-lineart-skillkit/skills/raster-to-layered-svg/SKILL.md
          cp -a /tmp/skillkit-extract/architectural-lineart-skillkit/. .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify skillkit
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyyaml
          python -m unittest discover -s tests -v
          node --check skills/offline-svg-color-workbench/assets/editor.js
      - name: Commit finalized repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: publish Agent Skills, offline editor, and examples'
          git push origin HEAD:main
